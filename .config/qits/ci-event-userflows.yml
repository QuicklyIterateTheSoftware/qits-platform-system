# The per-commit userflow run: `mvn verify` at the pushed commit — which regenerates
# service/target/userstories/ through the four story ITs — and the reports published as one docs
# bundle, site @userflows/qits-system-platform-service, version = the bare commit sha, branch riding as
# artifacts metadata for discovery.
#
# NON-GATING BY DESIGN, which is why it is a separate file from ci-post-receive.yml: this run going
# red must not cost the branch its image while "quality gate before merging" is still a decision to
# be taken — when it is, these per-commit runs are what the gate reads. One run per push per
# branch, collapsed to the newest tip under burst.
#
# THIS IS THE FIRST TIME THIS REPOSITORY'S SUITE RUNS IN CI AT ALL, and that is worth knowing before
# reading anything below. ci-post-receive.yml builds the image and nothing else: the Dockerfile's
# mvnw line carries `-DskipTests`, so until this file existed every test here had only ever run on a
# developer's machine. What that means concretely is the PTY suites — system/'s ForeignPtyTest and
# TerminalCttyTest, service/'s TerminalSocketTest and TerminalLingerTest — which fork real children
# on real pseudo-terminals through `setsid --ctty`. maven-base was already prepared for exactly
# that: it installs util-linux precisely because busybox's setsid applet rejects `--ctty`, and its
# own comment names "the daemon repositories' PTY suites" as the reason. Nothing else in this step
# is about them; they are simply what `verify` runs on the way to failsafe.
#
# `user: build`, and here it is NOT zonky's reason. There is no embedded postgres in this repository
# and no datasource of any kind — every answer is read from the docker daemon at the moment it is
# asked — so nothing here refuses to run as uid 0 the way initdb does. It stays `build` because the
# step forks real children on real terminals and there is no call for those to be root's, and
# because maven-base carries a passwd-backed uid 1001 (adduser -D) for whichever step wants one.
# A step container is started --cap-drop=ALL either way; /workspace is 1777 with a system-level
# safe.directory entry, so a non-root checkout is what the image was built to serve.
#
# THERE IS NO DOCKER SOCKET IN THIS STEP AND NONE IS WANTED, in the repository whose whole subject
# is docker. The suite points `qits.system.docker.binary` at a shell script under
# src/test/resources/fake-docker — a real ProcessBuilder forks a real child and the argv it gets is
# the argv the builders produced, so nothing is mocked and no daemon is needed. The story catalogue
# goes one step further: stories/support/StoryDocker STAGES that same script into
# target/story-docker/ (a directory only the launched artifact ever writes to, so the recording is
# not the surefire suite's several hundred calls) and reads back the argv-plus-exit-code log it
# writes. That is what makes the docker hop an OBSERVED `process` edge rather than a claim, while
# this step still runs in a container with no daemon and no capability to reach one — the
# clone-alone rule held in the one place it is hardest to hold. The single edge that stays declared
# is the unix socket BEHIND the CLI, which no tap can stand in front of. `docker: true` would be a
# socket grant for nothing.
#
# Quinoa is off (`-Dquarkus.quinoa=false` — the extension's root toggle; `.enabled` is silently
# ignored and npm still runs): the client is ci-post-receive.yml's business, where the
# qits-system-platform-frontend submodule is initialised and its lockfile origins are swapped against the
# platform's npm registry, and none of that ritual belongs here — the stories assert nothing about
# the SPA. It is also what keeps this step from needing the submodule at all: the daemon's clone
# does not recurse, so service/src/main/webui arrives EMPTY, and an empty directory is the one case
# Quinoa treats as a misconfiguration rather than as "no client" (application.properties, the
# service pom and docker/Dockerfile's `test -f` guard all say the same thing from their own side).
# The packaged fast-jar failsafe boots is otherwise exactly what ships.
#
# THE IT FLAGS ARE THE OTHER HALF, and they are why this repository does NOT opt its service
# module back into ITs the way qits-githost does. `skipITs` is true in the root pom and stays true;
# this module has five integration tests and exactly one of them does not belong to this run:
#
#   TokenValidationBootstrapIT  the catalogue's first class — the packaged boot with the OIDC tenant
#                               ON, which is also the only place it is ever on
#   HostOverviewIT              the machine window: the host, its node and the swarm around it
#   TerminalRefusalIT           who may hold a shell on the platform host, and what a refused one
#                               costs the daemon (nothing — which is the assertion)
#   TerminalSessionIT           a real shell and the host monitor, end to end on a real PTY
#   PackagedSurfaceIT           NOT in the list: half about the CLIENT (the base href at the root,
#                               the deep links, the fallback that must not swallow /system), which
#                               the quinoa line above deliberately does not build. A blanket
#                               `-DskipITs=false` would make this run red on a test that is right.
#
# THE LIST IS THE CATALOGUE, BY NAME, AND A NEW STORY CLASS JOINS IT IN THE SAME COMMIT — an
# unlisted class is silently never run and its diagram silently never published. Its ORDER here is
# not the run order: failsafe takes the classes as a set, and what orders them is
# UserflowClassOrderer, registered as junit's secondary orderer in the test application.properties
# and driven by each story's @UserflowRunsAfter. That ordering is load-bearing rather than tidy —
# every cumulative source (the idp's request log, StoryDocker's recording) is attributed by a
# cursor, so the startup JWKS fetch and the boot sweep's two docker calls land in whichever story
# drains FIRST, which the ordering makes TokenValidationBootstrapIT's first story.
#
# Naming the classes also keeps the property's own meaning ("run everything") intact for the
# `native` profile in service/pom.xml that sets it.
#
# NO REPAIR WAS NEEDED to make the two new test-scope jars resolve. This repository already carries
# `.qits-maven-settings.xml` and a `qits-maven` <repositories> entry — qits-auth-core and
# qits-arch-rules have always come from the platform registry — and docker/Dockerfile already builds
# with `--network host` and `-s .qits-maven-settings.xml`, so the image builds driven by
# ci-post-receive.yml and ci-event-release.yml resolve the new test classpath there the same way
# they already resolved those two. (`-DskipTests` skips test EXECUTION, not test COMPILATION, so the
# jars are fetched during an image build too; they are small, and qits-userflows' transitive
# Playwright is a jar, not a browser — nothing downloads Chromium unless a story asks for a Flow,
# and neither of these does.)
#
# Loop review: this pipeline PUTs a docs bundle and pushes no commit — no cycle. The bundle is
# published to qits-artifacts and read back by qits-docs, neither of which is this service. There is
# nothing else to darken in the launched process: this repository has no event bus client and no
# opentelemetry extension on its classpath, and the only two dial-outs a boot here makes are the
# JWKS fetch, which the IT points at its own MockIdp, and the glances image pull, which the
# inherited `qits.system.glances.pull-at-startup=false` switches off at source. Publish-if-absent:
# events redeliver and docs versions are immutable, so 409 is success (the qits-spa-ui-components
# release file's discipline).
event: SCMPublishCommit
when:
  # repoName, not repoId: since the identity cutover the git host's own coordinate is an opaque
  # UUID, so a name match belongs on the name. The event echoes the public name the push was
  # addressed with; a rename updates this line in the same campaign.
  - repoName: { exact: qits-system-platform-service }
    suppressCi: { exact: "false" }
checkout:
  branch: branch
  sha: sha
steps:
  - image: qits/build-images/maven-base:latest
    user: build
    timeout-seconds: 2400
    script: |
      set -eu
      # The platform registry, exactly as qits-eventstream's step derives it: the pom's default
      # names a host-published address unreachable from a step container, and the exact-id mirror
      # in .qits-maven-settings.xml is what passes Maven's HTTP blocker.
      export QITS_MAVEN_REPOSITORY_URL="$QITS_MAVEN_REGISTRY_URL"
      ./mvnw -B -ntp -s .qits-maven-settings.xml verify \
        -Dqits.maven.repository.url="$QITS_MAVEN_REPOSITORY_URL" \
        -Dquarkus.quinoa=false \
        -DskipITs=false \
        "-Dit.test=TokenValidationBootstrapIT,HostOverviewIT,TerminalRefusalIT,TerminalSessionIT"

      # `-C … .` so the story directories are the bundle's roots — nesting one directory deep would
      # put it in every served URL. The path is service/target/userstories because the stories live
      # in the one module that packages an artifact to boot; `system/` is a library jar.
      tar -czf userstories.tgz -C service/target/userstories .

      # Branch and commit ride as metadata (the docs store's exact-match discovery keys); the
      # version is the sha itself, so a bundle URL never changes meaning.
      status=$(curl -sS -o /tmp/docs-publish.out -w '%{http_code}' \
        -X PUT --data-binary @userstories.tgz \
        -H "X-Artifacts-Meta-git.branch.name: $QITS_CI_BRANCH" \
        -H "X-Artifacts-Meta-git.commit.hash: $QITS_CI_SHA" \
        -H "X-Artifacts-Meta-git.repository.name: qits-system-platform-service" \
        "$QITS_DOCS_URL/@userflows/qits-system-platform-service/-/$QITS_CI_SHA")
      case "$status" in
        201) echo "published userflows for qits-system-platform-service@$QITS_CI_SHA ($QITS_CI_BRANCH)" ;;
        409) echo "userflows for qits-system-platform-service@$QITS_CI_SHA already published — skipping" ;;
        *)   echo "docs publish failed: HTTP $status"; cat /tmp/docs-publish.out; exit 1 ;;
      esac
