# How qits-platform-deployments deploys this repo. It reads this file from the git host at the built
# sha, so the answer travels with the commit.
#
# CARRYING THE FILE AT ALL is the other thing it says. qits-workspaces reads it on a release to
# decide whether this repository deploys — a library or an SPA carries none and its release is the
# trunk push alone — and then promotes onto the branch it is configured with.
#
# PLATFORM service: one instance per platform, not one per environment. It is the right tier because
# what it shows is the MACHINE — one host, one docker daemon, one swarm — and every environment on
# it shares all three. A per-environment instance would be two services holding the same socket and
# showing the same node twice, and each would sweep the other's terminal containers on boot.
deployment_target: platform

# One route for the whole segment: the client at /system/, the API at /system/api, the terminal
# WebSocket at /system/api/terminals/{id} and the document at /system/q. qits-gateway routes
# verbatim by prefix, so this one line reaches all four.
routes: /system

# The left-navigation entry, and the number is its position. 14 puts it after Maintenance:13 at the
# end of the platform block the operator screens form — Githost:9, Mirror:10, Configuration:11,
# Orchestrator:12, Maintenance:13 — rather than among the per-project doors.
navigation: System:14

# NO `resources:` LINE, AND THAT IS THE DESIGN. This service is stateless: every answer is read from
# the docker daemon at the moment it is asked, and the only state it holds is the in-memory registry
# of live terminals — which a restart is MEANT to drop (the client reconnects and is told the
# session is gone). A database here would be a cache of facts that are already live, and a place for
# them to be wrong.
#
# WHAT IT DOES NEED IS NOT DECLARED HERE EITHER, because it is not a resource this deployer
# provisions: the host's docker socket. This is the third socket holder on the platform, after
# qits-containers and qits-deployments, and the grant is a deliberate, recorded act in the
# bootstrap's extras block — `mounts[]=bind:/var/run/docker.sock:/var/run/docker.sock` plus
# `groups[]=${DOCKER_GID}`, because the socket is root:docker 0660 and this image runs as uid 1001.
# Without both, the CLI is present and every call is a permission denial.

# The readiness endpoint the deployer's health gate curls. The convention derives it from the
# repository name and would land on exactly this path; it is written out because a probe that 404s
# fails a deployment for a reason nobody would look for in a config file.
#
# It is deliberately NOT a docker probe. Readiness here means "this process can answer", and the
# daemon being briefly unreachable is a 503 on a read, not a service that should be taken out of
# rotation and restarted — a restart would kill every live terminal to fix nothing.
health_path: /system/q/health/ready
