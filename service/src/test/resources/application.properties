# Test-only overrides. This module is the deployable, so its app-level settings live in
# src/main/resources/application.properties and Quarkus MERGES that file into the test config — it is
# not shadowed by this one. Never re-declare an app-level setting here: a test copy that drifts from
# the shipped copy makes the suite lie, passing on a value no deployment ever gets.

# A FREE port, not Quarkus' default test port 8081. Two reasons, and the first is not theoretical:
#   - on the deployment host 8081 is the address the platform's own npm registry is published on, so
#     on the one machine this service is most likely to be built on the default port is already
#     bound and the whole suite dies with "Port already bound: 8081", which reads like a code failure
#     and is not one;
#   - even where 8081 is free, @QuarkusTest restarts race each other for it.
# Failsafe passes the same value to the packaged artifact (service/pom.xml).
quarkus.http.test-port=0

# NO DEV SERVICES. A clone tests green with no docker, and a dev service is a container start:
# quarkus-oidc launches a real Keycloak whenever a profile leaves quarkus.oidc.auth-server-url unset.
# Nothing here needs one — the OIDC tenant is disabled because qits.auth.machine.required defaults
# false, and this service has no datasource at all.
quarkus.devservices.enabled=false

# THE SUITE RUNS AGAINST A FAKE DOCKER, and this is the line that arranges it: a shell script under
# src/test/resources/fake-docker that answers the reads with recorded output and runs a real echo
# loop for a terminal. The absolute path is computed at run time by FakeDocker (a config source),
# because a relative one would depend on which directory surefire was launched from.
#
# It is the whole reason these tests need no daemon: `docker` is a program on PATH as far as this
# service is concerned, and the suite gets to choose which program that is. The REAL docker CLI is
# exercised by the live smoke on the deployment host, not here.

# NO STARTUP SWEEP IN THE SUITE. The boot sweep would run its three docker calls against the fake
# on every @QuarkusTest restart; the pull in particular is noise in the log of every class. The
# sweep itself has its own test.
qits.system.glances.pull-at-startup=false

# A SHORT LINGER, so the test that proves an unattended session is reaped does not sleep for a
# minute. The shipped value is 60 seconds; nothing else in the suite depends on it being long.
qits.system.terminals.linger=PT2S
