# The application config for qits-platform-system as a standalone process.
#
# This module is the deployable, so this file is read at ordinal 250 and is the app's own settings —
# as opposed to a library jar's META-INF/microprofile-config.properties at ordinal 100, which is how
# `system` ships the DEFAULTS it does not own the deployment of (the docker binary and timeout, the
# glances image, the terminal limits). Any of those is overridable by env on top of this file.
#
# The tests read this file too — Quarkus merges src/test/resources/application.properties OVER it
# rather than replacing it — so everything below is in effect during the suite. That is deliberate:
# a test copy of an app-level key is free to drift from the shipped one, and then a green suite
# proves nothing about what actually starts.

quarkus.application.name=qits-platform-system

# The JAX-RS prefix every qits route lives under: /<segment>/api, where the segment is this
# service's name without the qits-platform- prefix. qits-gateway routes VERBATIM by prefix —
# /system/* reaches this service with the path untouched — so the leading segment is not
# decoration, it is the difference between being reachable through the gateway and not being
# reachable at all.
#
# NOTE the terminal WebSocket does NOT follow this key: @WebSocket takes a literal path, which
# api/TerminalSocket spells out as /system/api/terminals/{id}. The two move together by hand.
quarkus.rest.path=/system/api

# Quarkus' non-application root path: what the framework serves rather than application code (the
# OpenAPI document, swagger-ui, health). It sits OUTSIDE quarkus.rest.path and moves only via this
# key, so without it /q/* stays at the root — where a prefix-routing gateway cannot reach it. The
# readiness probe qits-platform-deployments' health gate curls is /system/q/health/ready, and it is
# this key that puts it there.
quarkus.http.non-application-root-path=/system/q

# --- the client ---------------------------------------------------------------------------------
# Quinoa builds src/main/webui (the qits-platform-spa-system submodule, an Angular SPA) during
# augmentation and serves the output as static resources.
#
# THE CLIENT IS SERVED AT THE ROOT, because this service has a host of its own —
# system.<env>.<domain>. The API and the terminal WebSocket keep their segment and are path-routed on
# every host, so the client's same-origin calls and its socket dial are unchanged; what moved is only
# where the page itself lives.
#
# THE TERMINAL SOCKET'S ORIGIN CHECK STILL PASSES, and it is worth saying why.
# TerminalOriginUpgradeCheck compares the handshake's Origin with X-Forwarded-Host. Served from this
# host the page's origin IS system.<env>.<domain>, which is the host the edge forwards — so the two
# agree, as they did when the page came from the environment host and the socket was dialled there.
#
# ui-root-path is now `/` and the client's angular.json says baseHref "/", so the two still agree —
# Quinoa mounts the files, the baseHref is what makes index.html ask for them at the right url, and a
# mismatch serves a page whose every asset 404s with nothing on this side to notice.
# PackagedSurfaceIT asserts the base href for exactly that reason.
quarkus.quinoa.ui-root-path=/

# Deep links. The client's own routes — /swarm/nodes/<id>/containers and /swarm/services/<id> — have
# no file behind them, so without this a reload or a pasted link 404s and only the entry page works.
# An operator shares a container's address with somebody; this is what makes that address work.
quarkus.quinoa.enable-spa-routing=true

# Angular's output. Quinoa can derive this from the client's angular.json, but it derives it from a
# project NAME — pinning it means a rename over there fails this build ("Quinoa build directory not
# found") rather than resolving somewhere stale.
quarkus.quinoa.build-dir=dist/qits-platform-spa-system/browser

# WHAT THE SPA FALLBACK MUST NOT SWALLOW.
#
# The fallback is a late-order catch-all: anything with a real route in front of it still wins, but a
# request matching NO route is rerouted to index.html and answers 200 text/html. The stake here is
# the client's own polling — GET /system/api/terminals while a session runs — and a mistyped or
# half-deployed path answering a PAGE would hand a JSON parser an HTML document. The correct answer
# to a mistyped machine path is a 404, and this key is the whole of what keeps it one.
#
# THE VALUE IS ABSOLUTE NOW. Entries are matched after ui-root-path is stripped, and the ui root is
# `/`, so nothing is stripped and every entry is the real path. The old relative spelling would name
# nothing.
#
# ONE ENTRY IS THE WHOLE LIST, because matching is by path SEGMENT: /system covers /system/api
# (quarkus.rest.path, and with it the terminal WebSocket at /system/api/terminals/<id>) and /system/q
# (quarkus.http.non-application-root-path) alike. It protects a segment and not a string prefix, so
# /system-nope is not covered by it and answers the page — which is right, that path belongs to
# nothing here.
#
# The segment is spelled in three keys of this file — quarkus.rest.path,
# quarkus.http.non-application-root-path and this one — plus `routes:` in .config/qits/deployments.yml.
# The client no longer spells it at all. Add a literal route outside the segment and its entry here
# IN THE SAME COMMIT.
quarkus.quinoa.ignored-path-prefixes=/system

# quarkus.quinoa.package-manager-install is deliberately NOT here. A local or CI mvnw build uses the
# node on PATH, so no build silently downloads a toolchain; the two install flags appear only in
# docker/Dockerfile's builder stage, which ships no node at all.
#
# Quinoa is also disabled by default in TEST mode and is left that way. A @QuarkusTest asserting
# anything about / would pass against a process with no client in it, so what the SPA is actually
# served as is proved against the packaged artifact and nowhere else — PackagedSurfaceIT.

# --- the API document ---------------------------------------------------------------------------
# Served at /system/q/openapi, with the browsable UI at /system/q/swagger-ui — both under
# quarkus.http.non-application-root-path above, not quarkus.rest.path.
quarkus.smallrye-openapi.info-title=qits-platform-system API
quarkus.swagger-ui.always-include=true

# --- identity -----------------------------------------------------------------------------------
# TWO TRACKS OF IDENTITY REACH THIS SERVICE AND THEY DO NOT REPLACE EACH OTHER. A request with no
# Authorization header is USER traffic: qits-gateway performed the login and asserted X-Qits-User /
# X-Qits-Roles, and qits-auth-core's ForwardAuthMechanism reads them. A request WITH a bearer is
# MACHINE traffic: quarkus-oidc validates the token against qits-platform-idp.
#
# BOTH LAND AS ROLES, which is why every route here is @RolesAllowed and none of them calls
# MachineAuth.require(). `qits:system` is the machine role and `qits:admin` the human one; every
# REST route accepts the pair.
#
# THE WEBSOCKET TAKES ONLY qits:admin. Reading the host's shape is something a machine may do; an
# interactive shell on the platform host is not. See api/TerminalSocket.
#
# THERE IS NO ANONYMOUS ROUTE HERE AND THERE MUST NEVER BE ONE. What this service reads is the whole
# machine, and what it can open is a shell on it.
#
# This service's own id — the aud value a token minted for it carries, and the client id
# qits-platform-idp knows it by. THE DEPLOYED VALUE IS INJECTED, per environment, as
# QITS_AUTH_MACHINE_AUDIENCE. The default below stays the bare name on purpose: an
# environment-qualified default would bake one environment into an image every environment shares.
qits.auth.machine.audience=qits-platform-system

# THE ROLLOUT GATE IS OFF (qits.auth.machine.required, defaulted false by qits-auth-core), and
# VALIDATION FOLLOWS THAT GATE rather than standing on its own. Gate off, there is no OIDC tenant,
# nothing fetches a JWKS, nothing waits on a host named qits-platform-idp, and a clone-alone
# `./mvnw verify` needs no issuer at all. There is no third state — either the gate and the
# validation are both on, or both off.
quarkus.oidc.tenant-enabled=${qits.auth.machine.required:false}

# Bearer-only: this service starts no login flow and holds no session — the gateway does both.
quarkus.oidc.auth-server-url=http://qits-platform-idp:8080/idp
quarkus.oidc.application-type=service

# Discovery OFF, path given. The issuer string is a public URL while the fetch happens internally on
# the platform's own networks, so a discovery document fetched from the issuer would name addresses
# this process cannot reach. The path is JOINED onto auth-server-url, so it is `jwks`, not
# `/idp/jwks`.
quarkus.oidc.discovery-enabled=false
quarkus.oidc.jwks-path=jwks

# A token minted for another service is not accepted here. Referenced, not repeated: one spelling of
# this service's name for the guard and for validation.
quarkus.oidc.token.audience=${qits.auth.machine.audience}

# AN UNREACHABLE IDP DOES NOT STOP THIS SERVICE. connection-delay turns the single boot attempt into
# a retried one — 30S is fifteen tries, two seconds apart, which covers idp coming up beside this
# service on a cold boot. When the window expires a WARN is logged and startup continues. Readiness
# deliberately stays independent of idp: the deployer health-gates this service, and tying its
# readiness to another service's would make a cold boot a question of ordering.
quarkus.oidc.connection-delay=30S
# And how fast a ROTATED idp key is picked up. An unknown `kid` buys ONE JWKS refresh, and the
# default 10M is the minimum before the next — so one attempt landing while idp is mid-cutover would
# mean ten minutes of 401s. PT5S ends it seconds after idp answers.
quarkus.oidc.token.forced-jwk-refresh-interval=PT5S

# --- the terminal transport -----------------------------------------------------------------------
# How long a WebSocket may sit with no traffic before the server closes it. A terminal is often idle
# — an operator watching glances types nothing for minutes — and an intermediary that drops a silent
# connection would look like the terminal dying on its own. 0 disables the server-side timeout; the
# client's own reconnect and the session's linger window are what handle a connection that is really
# gone.
quarkus.websockets-next.server.auto-ping-interval=30S

# --- the packaged artifact ----------------------------------------------------------------------
# Name the build output `qits-platform-system` rather than
# qits-platform-system-service-<version>-runner, so `-Dnative` produces
# target/qits-platform-system and the process is identifiable in `ps` / `docker top` — which matters
# here, because this service's own work is spawning `docker` children and somebody will read that
# process tree. The failsafe plugin's native.image.path in service/pom.xml spells the same name; the
# two are the same string in two files and move together.
quarkus.package.output-name=qits-platform-system
quarkus.package.jar.add-runner-suffix=false

# ForeignPty must be initialised at RUN time, and this line is the difference between a native build
# and no native build at all.
#
# Quarkus initialises application classes at BUILD time by default. For ForeignPty that means its
# `static final` downcall MethodHandles are constructed by the image builder and land in the image
# heap — and a MethodHandle bound to a native entry point cannot be analysed there. The build dies
# in the pointsto analysis with `unexpected input could not be handled: linkToNative`, pointing at
# ForeignPty.open. It is exactly backwards from what one expects: making the handles build-time
# constants is what breaks it, and the same class initialised at run time builds and runs.
#
# The descriptors themselves are declared in the domain jar's
# META-INF/native-image/eu.wohlben.qits/qits-platform-system-domain/reachability-metadata.json. Both
# are required and neither substitutes for the other: without the metadata GraalVM registers zero
# downcall stubs, without this flag it never gets far enough to use them.
quarkus.native.additional-build-args=--initialize-at-run-time=eu.wohlben.qits.system.terminal.ForeignPty

# The same flag is NOT settable here for the JVM path, and that asymmetry is worth a note: a runner
# jar cannot add its own JVM flags, so no property fixes it. Pass it on the command line:
#
#     java --enable-native-access=ALL-UNNAMED -jar target/quarkus-app/quarkus-run.jar
#
# Both modules' surefire blocks set it for the suites, which are the other place a JVM opens a PTY.
